services:
  - type: web
    name: flight-itinerary-discovery
    runtime: node
    # npm ci can fail on Linux (Render) vs Windows-generated locks: optional wasm peers
    # (@emnapi/*) resolve differently. `npm install` stays reproducible enough for deploys.
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
